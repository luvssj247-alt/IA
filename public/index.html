<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA: roleplay + realidad</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Historial</h2>
          <button id="newChatBtn" class="ghost-btn" type="button">+ Nueva</button>
        </div>

        <div id="chatList" class="chat-list" aria-live="polite"></div>

        <button id="clearAllChatsBtn" class="danger-btn" type="button">Vaciar todo</button>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <div>
            <h1>IA · Roleplay + realidad</h1>
            <p>Modelo principal: meta-llama/llama-3-8b-instruct:free</p>
          </div>
          <div class="api-config">
            <input id="apiKeyInput" type="password" placeholder="Pegar OpenRouter API key" aria-label="API key" />
            <button id="saveApiKeyBtn" type="button">Guardar clave</button>
            <span id="apiKeyStatus" class="muted"></span>
          </div>
        </header>

        <div class="chat-toolbar">
          <button id="clearChatBtn" type="button" class="secondary-btn">Vaciar conversación</button>
          <button id="deleteChatBtn" type="button" class="secondary-btn danger">Borrar historial</button>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="status" class="status" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <textarea id="userInput" rows="3" placeholder="Escribe tu mensaje..."></textarea>
          <div class="composer-actions">
            <button type="submit">Enviar</button>
          </div>
        </form>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
